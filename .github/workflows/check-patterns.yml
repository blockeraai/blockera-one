name: Check Pattern Localization

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
        paths:
            - 'patterns/**'
            - '.patterns.config.js'
            - 'packages/utils/js/patterns/**'
            - 'packages/dev-tools/js/patterns/**'
            - 'packages/dev-tools/js/webpack/localize-patterns-plugin.js'
            - '.github/workflows/check-patterns.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    check-patterns:
        name: patterns are localized
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'blockeraai/blockera-one' || github.event_name == 'pull_request' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: ./.github/setup-node

            - name: Check pattern files are localized
              run: |
                  node ./packages/dev-tools/js/patterns/localize-patterns-cli.js --check --quiet
