name: Cypress Components Tests

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]

    workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    cypress_components_tests:
        name: Cypress Components Tests
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'blockeraai/blockera-one' || github.event_name == 'pull_request' }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Find Specs Files
              id: find_specs_files
              run: echo "file_count=$(find ./packages/blockera-one-* ./packages/*-one -name "*.component.cy.js" 2>/dev/null | wc -l | tr -d '[:space:]')" >> $GITHUB_OUTPUT

            - name: Setup Node.js and install dependencies
              if: steps.find_specs_files.outputs.file_count != '0'
              uses: ./.github/setup-node

            - name: Install Cypress
              if: steps.find_specs_files.outputs.file_count != '0'
              run: npx cypress install

            - name: Build theme assets
              if: steps.find_specs_files.outputs.file_count != '0'
              run: npm run build

            - name: Run Cypress Tests
              if: steps.find_specs_files.outputs.file_count != '0'
              run: npm run test:ct -- --spec "./packages/blockera-one-*/**/*.component.cy.js" "./packages/*-one/**/*.component.cy.js"
