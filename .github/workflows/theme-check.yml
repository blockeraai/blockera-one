name: Blockera One Theme Checkup

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    test_wp_theme_check:
        name: WordPress Theme Review
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ github.repository == 'blockeraai/blockera-one' || github.event_name == 'pull_request' }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            # theme-check reuses plugin-check/prepare-build.sh; theme zip generator differs.
            BLOCKERA_PLUGIN_CHECK_BUILD_CMD: >-
                php ./bin/generate-build-theme-zip-sh.php >./bin/build-theme-zip.temp.sh
                && chmod +x ./bin/build-theme-zip.temp.sh
                && NO_CHECKS=true NO_INSTALL_NPM=true NO_INSTALL_COMPOSER=true ./bin/build-theme-zip.temp.sh
                && rm -f ./bin/build-theme-zip.temp.sh
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/theme-check
              with:
                  zip-file: blockera-one.zip
                  build-dir: ./build/blockera-one
                  accessible-ready: 'true'

    test_php_security_check:
        name: PHP Security Check
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ github.repository == 'blockeraai/blockera-one' || github.event_name == 'pull_request' }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/php-security-check
