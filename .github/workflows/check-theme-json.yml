name: Check theme.json Sync

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
        paths:
            - 'theme-config/**'
            - 'theme.json'
            - 'packages/global-packages/packages/dev-tools/js/theme-json/**'
            - '.github/workflows/check-theme-json.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    check-theme-json:
        name: theme.json matches theme-config
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'blockeraai/blockera-one' || github.event_name == 'pull_request' }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - name: Check theme.json is in sync with theme-config
              run: |
                  node ./packages/global-packages/packages/dev-tools/js/theme-json/merge-theme-json.js --check
