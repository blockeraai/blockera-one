name: Check Block Markup

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
        paths:
            - 'patterns/**'
            - 'patterns-woocommerce/**'
            - 'templates/**'
            - '.block-markup.config.js'
            - 'packages/global-packages/packages/dev-tools/js/block-markup/**'
            - 'packages/global-packages/packages/dev-tools/js/webpack/normalize-block-markup-plugin.js'
            - '.github/workflows/check-block-markup.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    check-block-markup:
        name: block-markup is normalized
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ github.repository == 'blockeraai/blockera-one' || github.event_name == 'pull_request' }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - name: Check block-markup files are normalized
              run: |
                  node ./packages/global-packages/packages/dev-tools/js/block-markup/normalize-block-markup-cli.js --check --quiet
