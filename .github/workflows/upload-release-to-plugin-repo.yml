name: Update Changelog and upload Blockera One theme to WordPress.org theme repo

on:
    release:
        types: [published]

jobs:
    get-release-branch:
        name: Get release branch name
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: github.repository == 'blockeraai/blockera-one'
        outputs:
            release_branch: ${{ steps.get_release_branch.outputs.release_branch }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - id: get_release_branch
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/upload-release-to-plugin-repo/compute-release-branch.sh

    upload:
        name: Publish as trunk (and tag)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: wp.org theme
        needs: [get-release-branch]
        if: ${{ github.repository == 'blockeraai/blockera-one' && !github.event.release.prerelease && github.event.release.assets[0] }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            BLOCKERA_UPLOAD_PLUGIN_REPO_URL: 'https://themes.svn.wordpress.org/blockera-one'
            BLOCKERA_UPLOAD_ZIP_NAME: blockera-one.zip
            SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
            SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
            VERSION: ${{ github.event.release.name }}
            PLUGIN_URL: ${{ github.event.release.assets[0].browser_download_url }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/upload-release-to-plugin-repo/publish-to-svn.sh
