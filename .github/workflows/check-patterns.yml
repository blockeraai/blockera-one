name: Check Pattern Localization

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
        paths:
            - 'patterns/**'
            - '.patterns.config.js'
            - 'packages/utils/js/patterns/**'
            - 'packages/global-packages/packages/dev-tools/js/patterns/**'
            - 'packages/global-packages/packages/dev-tools/js/webpack/localize-patterns-plugin.js'
            - '.github/workflows/check-patterns.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    check-patterns:
        name: patterns are localized
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'blockeraai/blockera-one' || github.event_name == 'pull_request' }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - name: Check pattern files are localized
              run: |
                  node ./packages/global-packages/packages/dev-tools/js/patterns/localize-patterns-cli.js --check --quiet
