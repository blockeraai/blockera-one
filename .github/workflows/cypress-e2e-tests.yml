name: Cypress E2E Tests

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

env:
    BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
    # create-wp-env.js downloads the companion plugin from GitHub tree URLs.
    GITHUB_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
    BLOCKERA_E2E_SCAN_ROOTS: packages
    BLOCKERA_E2E_PACKAGE_SUFFIX: -one
    BLOCKERA_E2E_PACKAGE_PREFIX: blockera-one-
    BLOCKERA_E2E_GENERAL_CATEGORY: general-1
    BLOCKERA_E2E_SHARD_SIZE: '50'
    BLOCKERA_E2E_PACKAGE_GLOB: 'packages/**-one(-**|)/**'
    BLOCKERA_E2E_USE_CREATE_WP_ENV: 'true'
    BLOCKERA_E2E_CI_ENV: 'true'
    BLOCKERA_WP_ENV_PR_PLUGIN_CATEGORIES: companion-plugin
    BLOCKERA_WP_ENV_STRIP_DOT_PLUGINS: 'true'
    BLOCKERA_WP_ENV_DEFAULT_THEME: '.'
    BLOCKERA_WP_ENV_FREE_EXTRACT_DIR: .github/cache/blockera
    BLOCKERA_WP_ENV_DEFAULT_PLUGIN: https://github.com/blockeraai/blockera/tree/master
    BLOCKERA_WP_ENV_DEFAULT_PLUGIN_CATEGORIES: companion-plugin

jobs:
    detect_categories:
        name: Detecting E2E Test Categories
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            categories: ${{ steps.detect.outputs.categories }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - id: detect
              run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/cypress-e2e-tests/detect-categories.sh

    cypress_e2e_tests:
        name: Test
        needs: detect_categories
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ github.repository == 'blockeraai/blockera-one' || github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                category: ${{ fromJson(needs.detect_categories.outputs.categories) }}
        env:
            BLOCKERA_E2E_CATEGORY: ${{ matrix.category }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/cypress-e2e-tests/run.sh
